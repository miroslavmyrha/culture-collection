# Production stack (#178, ADR 0009 hosting): PostgreSQL, the API and the proxy on one host.
# Start it with deploy/deploy.sh, which creates the database roles and migrates first.
# Settings come from deploy/.env (copy .env.example); secrets from files in deploy/secrets/
# (ENV_FILE and SECRETS_DIR point elsewhere, as deploy/e2e-production.sh does),
# never from the environment of the shell. Only the proxy publishes ports.
name: cultures

x-hardened: &hardened
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    <<: *hardened
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    # The entrypoint hands the data directory to the postgres user, then drops to it.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: cultures
      POSTGRES_USER: cultures
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_admin_password]
    volumes: ["${DB_DATA:-db-data}:/var/lib/postgresql"]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cultures -d cultures"]
      interval: 5s
      retries: 30

  backend:
    <<: *hardened
    image: ${BACKEND_IMAGE:-cultures-backend:production}
    build: {context: ../backend, target: runtime}
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    env_file: ${ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      MFA_SECRET_KEY_FILE: /run/secrets/mfa_secret_key
      DATABASE_URL_FILE: /run/secrets/database_url
      DJANGO_BEHIND_TLS_PROXY: "true"
      # The proxy's fixed address below: the only peer whose X-Forwarded-* the app reads.
      DJANGO_TRUSTED_PROXIES: ${PROXY_ADDRESS:-10.178.0.10}
      REQUEST_ID_FROM_PROXY: "true"
    secrets: [django_secret_key, mfa_secret_key, database_url]
    # The trust bundle of the timestamp provider (#283): AUDIT_TIMESTAMP_CA_FILE=/run/tsa/ca.pem.
    volumes: ["${TSA_DIR:-./tsa}:/run/tsa:ro"]
    networks: [data, web]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      # /readyz also proves the app runs as the runtime role (ADR 0005).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  proxy:
    <<: *hardened
    image: ${PROXY_IMAGE:-cultures-proxy:production}
    build: {context: ../frontend}
    read_only: true
    # The entrypoint renders the config into conf.d (owned by nginx, uid 101); nginx keeps its
    # temp files in /tmp.
    tmpfs: ["/tmp:size=64m", "/etc/nginx/conf.d:size=1m,uid=101,gid=101"]
    environment:
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:?set DJANGO_ADMIN_PATH in deploy/.env}
    ports: ["${HTTP_PORT:-80}:8080", "${HTTPS_PORT:-443}:8443"]
    # fullchain.pem and privkey.pem, renewed outside the stack (certbot on the host, an
    # institution's CA); `docker compose -f deploy/compose.yaml exec proxy nginx -s reload` after.
    volumes: ["${TLS_DIR:-./certs}:/etc/nginx/certs:ro"]
    networks:
      web: {ipv4_address: "${PROXY_ADDRESS:-10.178.0.10}"}
    depends_on:
      backend: {condition: service_healthy}

  # The scheduled jobs (#180): supercronic runs backend/crontab from the API's own image, so a
  # release or a rollback moves both together. Each job reports to Healthchecks through
  # tools/run_job.py (HEALTHCHECKS_PING_URL in secrets/healthchecks_ping_url, empty: nothing is
  # reported). The backups are not here: they need docker, and no container gets its socket.
  scheduler:
    <<: *hardened
    image: ${BACKEND_IMAGE:-cultures-backend:production}
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    env_file: ${ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      MFA_SECRET_KEY_FILE: /run/secrets/mfa_secret_key
      DATABASE_URL_FILE: /run/secrets/database_url
      HEALTHCHECKS_PING_URL_FILE: /run/secrets/healthchecks_ping_url
    secrets: [django_secret_key, mfa_secret_key, database_url, healthchecks_ping_url]
    # The anchor job verifies the token against the same bundle as the API (#283).
    volumes: ["${TSA_DIR:-./tsa}:/run/tsa:ro"]
    command: ["supercronic", "-passthrough-logs", "-prometheus-listen-address", "127.0.0.1:9746", "${SCHEDULER_CRONTAB:-/app/crontab}"]
    # data for the database and the API, web for the proxy and the way out to Healthchecks.
    networks: [data, web]
    depends_on:
      backend: {condition: service_healthy}
      proxy: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9746/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # The database is reachable from the API only, and from nowhere outside.
  data: {internal: true}
  web:
    ipam:
      config: [{subnet: "${WEB_SUBNET:-10.178.0.0/24}"}]

secrets:
  db_admin_password: {file: "${SECRETS_DIR:-./secrets}/db_admin_password"}
  django_secret_key: {file: "${SECRETS_DIR:-./secrets}/django_secret_key"}
  # The key of the TOTP secrets (#176): losing it takes every authenticator app away.
  mfa_secret_key: {file: "${SECRETS_DIR:-./secrets}/mfa_secret_key"}
  database_url: {file: "${SECRETS_DIR:-./secrets}/database_url"}
  healthchecks_ping_url: {file: "${SECRETS_DIR:-./secrets}/healthchecks_ping_url"}

volumes:
  db-data:
