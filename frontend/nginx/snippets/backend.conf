# To gunicorn. The API sets its own security headers (CSP default-src 'none', HSTS).
proxy_pass http://backend:8000;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Appends the address this proxy saw; Django walks the list from the right over DJANGO_TRUSTED_PROXIES.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Replaces whatever the client sent: the app keeps it only with REQUEST_ID_FROM_PROXY=true (#41).
proxy_set_header X-Request-ID $request_id;
proxy_read_timeout 60s;
