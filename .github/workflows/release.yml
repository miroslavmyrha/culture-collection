# A release (#179): a tag vX.Y.Z on main builds both images, pushes them to GHCR by version,
# signs each by digest with cosign keyless (Sigstore, this workflow's GitHub identity), and
# publishes the GitHub release with its CHANGELOG.md section and the dependency updates.
# deploy/deploy.sh X.Y.Z verifies that identity before it starts anything.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # the GitHub release
      packages: write # the images on GHCR
      id-token: write # cosign keyless signing
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the previous tag and origin/main

      - name: The tag is on main and CHANGELOG.md has its section
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main: release from a merge of develop into main"; exit 1; }
          python3 backend/tools/release_notes.py "$version" CHANGELOG.md > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Dependabot's updates since the previous release: they write no changelog line (#277).
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA^" 2>/dev/null || true)
          since=$( [ -n "$previous" ] && git log -1 --format=%cI "$previous" || echo 1970-01-01T00:00:00Z )
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --author app/dependabot \
            --search "merged:>$since" --limit 200 --json number,title > "$RUNNER_TEMP/dependabot.json"
          python3 backend/tools/release_notes.py "$VERSION" CHANGELOG.md "$RUNNER_TEMP/dependabot.json" \
            > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Backend image
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: runtime
          push: true
          tags: ${{ env.REGISTRY }}-backend:${{ steps.version.outputs.version }}
          sbom: true
          provenance: mode=max

      - name: Proxy image
        id: proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          tags: ${{ env.REGISTRY }}-proxy:${{ steps.version.outputs.version }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign both images by digest
        env:
          BACKEND: ${{ env.REGISTRY }}-backend@${{ steps.backend.outputs.digest }}
          PROXY: ${{ env.REGISTRY }}-proxy@${{ steps.proxy.outputs.digest }}
        run: |
          cosign sign --yes "$BACKEND"
          cosign sign --yes "$PROXY"

      - name: GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BACKEND: ${{ env.REGISTRY }}-backend@${{ steps.backend.outputs.digest }}
          PROXY: ${{ env.REGISTRY }}-proxy@${{ steps.proxy.outputs.digest }}
        run: |
          {
            echo
            echo "### Images"
            echo "- \`$BACKEND\`"
            echo "- \`$PROXY\`"
            echo
            echo "Deploy with \`deploy/deploy.sh $VERSION\`: it verifies both signatures first."
          } >> "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
