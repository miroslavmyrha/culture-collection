# The same checks as ./check.sh locally. CI is the safety net, not the first run.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: "17 5 * * *" # daily dependency audit, so new advisories show up without a code change
  workflow_dispatch:

permissions:
  contents: read

# Per event and branch (#252): the nightly run and a push to develop no longer cancel each other,
# so every merge keeps its develop result; a newer push still cancels an older push run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same pin as check.sh (#290).
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # Measured 2026-11-19: 19 to 26 min; a slow runner took half as long again for the backend tests and hit the old 30 (#280).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the commits of the pull request

      - name: Secrets in the commits of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE"
          git --no-banner --redact --log-opts="$BASE..HEAD" .

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependencies and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium-headless-shell

      - name: API as the runtime role, with a throwaway e2e user, lab and membership
        run: |
          # The checkout belongs to the runner's user: the container must write as that uid.
          APP_UID=$(id -u)
          export APP_UID
          echo "APP_UID=$APP_UID" >> "$GITHUB_ENV"
          # Fresh passwords per run: nothing to store, nothing to leak, works for forks.
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          DB_MIGRATION_PASSWORD=$(openssl rand -hex 24)
          DB_RUNTIME_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$DB_MIGRATION_PASSWORD"
          echo "::add-mask::$DB_RUNTIME_PASSWORD"
          export DB_MIGRATION_PASSWORD DB_RUNTIME_PASSWORD
          # Production's order (ADR 0005): roles, migrate as the migration role, then the
          # API as the runtime role. It fails unless /readyz confirms that role.
          tools/up-with-runtime-role.sh
          # The same seed as locally, written by the runtime role through the services.
          docker compose exec -T -e E2E_PASSWORD="$password" backend python manage.py seed_e2e

      - name: ./check.sh e2e
        run: ./check.sh e2e

      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The e2e suite once through the production images, compose file and proxy (#178): TLS, the
  # CSP nonce per response, the __Host- cookies and the runtime role, as a deployment runs them.
  production:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependencies and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium-headless-shell

      - name: deploy/e2e-production.sh
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          E2E_PASSWORD=$password deploy/e2e-production.sh

      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-production
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # A release that does not come up healthy is replaced by the running one again (#179).
  rollback:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: deploy/e2e-rollback.sh
        run: deploy/e2e-rollback.sh

  # A backup restored into an empty stack, its rows and audit chains verified, and the three
  # ways a restore must refuse (#177). About 3 min locally with the images built.
  restore:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: deploy/e2e-restore.sh
        run: deploy/e2e-restore.sh

  # The scheduled jobs through the production stack (#180): supercronic runs the heartbeat, every
  # line of backend/crontab runs once, and each reports to a Healthchecks stand-in as it should.
  jobs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: deploy/e2e-jobs.sh
        run: deploy/e2e-jobs.sh

  # A pull request that changes code states what changed in CHANGELOG.md (#206). On pull requests
  # only: per commit, four parallel branches would fight over the same section at every rebase.
  # Every commit of a pull request passes check.sh alone, which is what keeps the history
  # bisectable (#213). One runner per commit, in parallel, instead of a queue on one machine.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: read
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The branch's own commits, from where it left its base, so neither the base's commits
          # nor the merge commit a pull request checkout puts at HEAD are checked as the branch's.
          commits=$(git log --format=%H --reverse "$(git merge-base "$BASE" "$HEAD_SHA")..$HEAD_SHA")
          count=$(printf '%s\n' "$commits" | grep -c . || true)
          if [ "$count" -gt 20 ]; then
            echo "::error::This pull request carries $count commits and the matrix holds 20." \
              "Split it, or say in the pull request why it has to be one branch."
            exit 1
          fi
          # python3 rather than jq, so the same line runs in a local proof of this job.
          list=$(printf '%s\n' "$commits" | grep . | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "$count commits to check on their own"

  per-commit:
    needs: commits
    runs-on: ubuntu-24.04
    # Measured 2026-11-19: 16 to 18 min per commit, half as long again on a slow runner (#280).
    timeout-minutes: 40
    strategy:
      fail-fast: false # every commit reports, so one red commit does not hide the next
      matrix:
        commit: ${{ fromJSON(needs.commits.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: ./check.sh on ${{ matrix.commit }}
        run: |
          APP_UID=$(id -u)
          export APP_UID
          ./check.sh

  changelog:
    # Dependabot's base image and package updates write no line: the release notes list them
    # from their pull requests (#277).
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff is against the base of the pull request, not a fixed branch
      - name: Code changed, CHANGELOG.md not
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # From where the branch left its base, so commits the base gained meanwhile are not
          # read as changes of this branch.
          changed=$(git diff --name-only "$(git merge-base "$BASE" HEAD)" HEAD)
          if ! printf '%s\n' "$changed" | grep -qE '^(backend|frontend)/'; then
            echo "Nothing changed under backend/ or frontend/, so no changelog line is needed."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qxF 'CHANGELOG.md'; then
            echo "CHANGELOG.md is among the changed files."
            exit 0
          fi
          echo "::error file=CHANGELOG.md::This pull request changes code under backend/ or frontend/ and leaves CHANGELOG.md untouched. Add a line to the Unreleased section naming your issue, and the rule id of docs/compliance.md when the entry changes a regulated rule."
          exit 1

  # A pull request that changes a lock file is audited before it reaches develop (#132).
  locks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qxE 'backend/uv\.lock|frontend/package-lock\.json'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  audit:
    needs: [locks]
    # always(): on a schedule or a manual run the locks job is skipped, and a skipped need
    # would skip this job too.
    if: >-
      always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || needs.locks.outputs.changed == 'true')
    runs-on: ubuntu-24.04
    # Measured 2026-11-18: 15 min, half as long again on a slow runner (#280).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: ./check.sh audit
        run: ./check.sh audit
