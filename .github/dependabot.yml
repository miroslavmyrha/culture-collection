# Base images move by a reviewed pull request, digest and version together: the backend's
# (#262), the proxy's and the production database's (#178).
version: 2
updates:
  - package-ecosystem: docker
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    labels: ["type: chore", "area: ops"]
  - package-ecosystem: docker
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    labels: ["type: chore", "area: ops"]
  - package-ecosystem: docker-compose
    directory: /deploy
    target-branch: develop
    schedule:
      interval: weekly
    labels: ["type: chore", "area: ops"]
