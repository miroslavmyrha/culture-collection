rules:
  - id: choices-without-check-constraint
    languages: [python]
    # INFO: on real code most fields are written only through forms and serializers. Raise
    # it to WARNING for state fields that services, tasks or imports write.
    severity: INFO
    message: >-
      choices= is checked only by forms, serializers and full_clean(). save() does not call
      full_clean(), so services, tasks, admin actions, update(), bulk_create() and raw SQL
      store any value. Add CheckConstraint(condition=Q($FIELD__in=...values), name=...) to
      Meta.constraints.
    paths:
      exclude: ["**/migrations/**"]
    patterns:
      - pattern-inside: |
          class $MODEL(...):
            ...
      - pattern: $FIELD = models.$TYPE(..., choices=$C, ...)
      # A constraint built from settings (LANGUAGES) makes a new migration on every change.
      - pattern-not: $FIELD = models.$TYPE(..., choices=settings.$S, ...)
      - pattern-not-inside: |
          class $MODEL(...):
            ...
            class Meta:
              ...
              constraints = [..., models.CheckConstraint(...), ...]
              ...
            ...
      - pattern-not-inside: |
          class $MODEL(...):
            ...
            class Meta:
              ...
              constraints = [..., CheckConstraint(...), ...]
              ...
            ...
      - pattern-not-inside: |
          class $MODEL(...):
            ...
            class $META(...):
              ...
              constraints = (..., models.CheckConstraint(...), ...)
              ...
            ...
      - pattern-not-inside: |
          class $MODEL(...):
            ...
            class $META(...):
              ...
              constraints = [..., models.CheckConstraint(...), ...]
              ...
            ...
      # An abstract model: the concrete models that inherit the field own the constraint.
      - pattern-not-inside: |
          class $MODEL(...):
            ...
            class Meta:
              ...
              abstract = True
              ...
            ...
      - pattern-not-inside: |
          class $MODEL(...):
            ...
            class Meta($BASE):
              ...
              abstract = True
              ...
            ...
