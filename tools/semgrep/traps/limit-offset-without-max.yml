rules:
  - id: limit-offset-without-max
    languages: [python]
    severity: WARNING
    message: >-
      LimitOffsetPagination without max_limit: max_limit is None, so ?limit=1000000 returns
      the whole table in one response. Use a project paginator with max_limit set.
    pattern-either:
      - pattern: pagination_class = LimitOffsetPagination
      - pattern: pagination_class = pagination.LimitOffsetPagination
      - pattern: |
          {..., "DEFAULT_PAGINATION_CLASS": "rest_framework.pagination.LimitOffsetPagination", ...}
      - patterns:
          - pattern: |
              class $P(..., $BASE, ...):
                ...
          - metavariable-regex:
              metavariable: $BASE
              regex: ^(pagination\.)?LimitOffsetPagination$
          - pattern-not: |
              class $P(..., $BASE, ...):
                ...
                max_limit = $N
                ...
