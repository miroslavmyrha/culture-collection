  /api/v1/labs/{lab_public_id}/batch-checks/:
    get:
      operationId: labs_batch_checks_list
      description: |-
        The lab comes from the URL and is resolved through the caller's labs first: not a
        member gives 404 for every action, before any role check or input validation.
      parameters:
      - in: query
        name: batch
        schema:
          type: string
          format: uuid
      - in: path
        name: lab_public_id
        schema:
          type: string
          format: uuid
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: strain
        schema:
          type: string
          format: uuid
