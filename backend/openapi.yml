    PreparationOutput:
      type: object
      description: |-
        A prepared shipment (#89): open while it waits for a second person, or withdrawn and
        kept as history. `confirm_refusal` says why the caller may not confirm it: they approved the
        request or prepared it (ADR 0009); null when they may, as far as identity goes.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        transport_class:
          allOf:
          - $ref: '#/components/schemas/TransportClass'
          readOnly: true
        classification_basis:
          allOf:
          - $ref: '#/components/schemas/ClassificationBasis'
          readOnly: true
        basis_note:
          type: string
          readOnly: true
        packing_instruction:
          allOf:
          - $ref: '#/components/schemas/PackingInstruction'
          readOnly: true
        coolant:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/Coolant'
          - $ref: '#/components/schemas/BlankEnum'
        coolant_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        responsible_name:
          type: string
          nullable: true
          description: Null for a caller who may not see people; empty once the person
            was erased.
          readOnly: true
        responsible_phone:
          type: string
          nullable: true
          readOnly: true
        carrier:
          type: string
          readOnly: true
        tracking_number:
          type: string
          readOnly: true
        prepared_by:
          type: string
          readOnly: true
        prepared_at:
          type: string
          format: date-time
          readOnly: true
        withdrawn_by:
          type: string
          readOnly: true
          nullable: true
        withdrawn_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        withdraw_reason:
          type: string
          readOnly: true
        confirm_refusal:
          nullable: true
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/PreparationOutputConfirmRefusalEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - basis_note
      - carrier
      - classification_basis
      - confirm_refusal
      - coolant
      - coolant_kg
      - packing_instruction
      - prepared_at
      - prepared_by
      - public_id
      - responsible_name
      - responsible_phone
      - tracking_number
      - transport_class
      - withdraw_reason
      - withdrawn_at
      - withdrawn_by
