          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - identified_on
      - is_current
      - method
      - public_id
      - reason
      - taxon
    LabOutput:
      type: object
      description: A lab and the caller's role in it (annotated by the selector, never
        one query per row).
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        code:
          type: string
          readOnly: true
        my_role:
          allOf:
          - $ref: '#/components/schemas/Role'
          readOnly: true
      required:
      - code
      - my_role
      - name
      - public_id
    LoginInputRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - password
      - username
    MeOutput:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
      required:
      - email
      - first_name
      - last_name
      - public_id
      - username
    MemberCreateInputRequest:
      type: object
      properties:
        username:
