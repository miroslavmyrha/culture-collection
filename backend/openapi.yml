          readOnly: true
        taxon:
          allOf:
          - $ref: '#/components/schemas/TaxonBrief'
          readOnly: true
        identified_on:
          type: string
          format: date
          readOnly: true
        method:
          type: string
          readOnly: true
        reason:
          type: string
          readOnly: true
