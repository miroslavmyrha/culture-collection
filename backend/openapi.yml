              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
    post:
      operationId: labs_batch_checks_create
      description: |-
        The lab comes from the URL and is resolved through the caller's labs first: not a
        member gives 404 for every action, before any role check or input validation.
      parameters:
      - in: path
        name: lab_public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckInputRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCheckOutput'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'Invalid input on a field: an unknown batch, vial or check
            to correct, a method that is not of the kind, a value without its unit,
            a reduced result without a note, a date in the future or before the batch
            was preserved'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: batch_exhausted; vial_not_available; check_entered_in_error;
            vial_not_in_collection
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: reason_required
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
