      - image/png
      - image/jpeg
      type: string
      description: |-
        * `application/pdf` - PDF
        * `image/png` - PNG image
        * `image/jpeg` - JPEG image
    EndConfirmInputRequest:
      type: object
      properties:
        proposal:
          type: string
          format: uuid
          description: The public id of the proposal the manager read.
      required:
      - proposal
    EndProposalOutput:
      type: object
      description: |-
        The open proposal to end a restriction (#105). It names nobody: `confirm_refusal` says
        the caller proposed it and so may not confirm it (ADR 0009); null when they may, as far as
        identity goes (confirming is a manager's, strains.confirm_restriction_end).
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        reason:
          type: string
          readOnly: true
        proposed_at:
          type: string
          format: date-time
          readOnly: true
        confirm_refusal:
          nullable: true
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/EndProposalOutputConfirmRefusalEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - confirm_refusal
      - proposed_at
      - public_id
      - reason
    EndProposalOutputConfirmRefusalEnum:
      enum:
      - confirm_own_end_proposal
      type: string
      description: '* `confirm_own_end_proposal` - confirm_own_end_proposal'
    EndProposeInputRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          description: 'Why, in a sentence. Stored for good: name no person.'
          maxLength: 2000
      required:
      - reason
    EndWithdrawInputRequest:
      type: object
      properties:
        proposal:
          type: string
          format: uuid
          description: The public id of the proposal the manager read.
        reason:
          type: string
          minLength: 1
          description: 'Why, in a sentence. Stored for good: name no person.'
          maxLength: 2000
      required:
      - proposal
      - reason
