        * `unknown` - Unknown
        * `none_known` - No pathogenicity known
        * `pathogenic` - Pathogenic
    Problem:
      type: object
      description: The error body of every API response with status 400 and above.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemFieldError'
      required:
      - code
      - detail
      - errors
      - status
      - title
      - type
    ProblemFieldError:
      type: object
      properties:
        attr:
          type: string
          nullable: true
        code:
          type: string
        detail:
          type: string
      required:
      - attr
      - code
      - detail
