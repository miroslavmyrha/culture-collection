        Home: what waits for the signed-in person in each of their labs, by kind, and per lab the
        role, the figures and the actions the role may start. Scoped by the person's memberships:
        nobody else's labs, and in each lab only what the role may handle or see. No lab: empty.
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/taxa/:
    get:
      operationId: taxa_list
      description: Taxa by name. `search` finds names containing the text.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      tags:
      - taxa
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaxonOutputList'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/taxa/{public_id}/:
    get:
      operationId: taxa_retrieve
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - taxa
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonOutput'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
components:
  schemas:
    AbsScope:
      enum:
      - not_in_scope
      - in_scope
      - unknown
      type: string
      description: |-
        * `not_in_scope` - Not in scope
        * `in_scope` - In scope
        * `unknown` - Unknown
    AcceptanceInputRequest:
      type: object
      description: Sent as multipart/form-data with the signed copy.
      properties:
        mta:
          type: string
          format: uuid
        signer_name:
          type: string
          minLength: 1
          maxLength: 200
        signer_email:
          oneOf:
          - type: string
            format: email
            default: ''
            maxLength: 254
          - type: string
            maxLength: 0
        signer_role:
          $ref: '#/components/schemas/SignerRole'
        authorised_signatory:
          type: boolean
        accepted_on:
          type: string
          format: date
        file:
          type: string
          format: binary
      required:
      - accepted_on
      - authorised_signatory
      - file
      - mta
      - signer_name
      - signer_role
    AcceptanceOutput:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        mta:
          allOf:
          - $ref: '#/components/schemas/MtaBrief'
          readOnly: true
        signer_name:
          type: string
          nullable: true
          description: Null for a caller who may not see people; empty once the signer
            was erased.
          readOnly: true
        signer_role:
          allOf:
          - $ref: '#/components/schemas/SignerRole'
          readOnly: true
        authorised_signatory:
          type: boolean
          readOnly: true
        accepted_on:
          type: string
          format: date
          readOnly: true
        document:
          allOf:
          - $ref: '#/components/schemas/DocumentOutput'
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - accepted_on
      - authorised_signatory
      - created_at
      - document
      - mta
      - public_id
      - signer_name
      - signer_role
    ActionsEnum:
      enum:
      - receive_deposit
      - record_check
      - find_vial
      - enter_request
      type: string
      description: |-
        * `receive_deposit` - receive_deposit
        * `record_check` - record_check
        * `find_vial` - find_vial
        * `enter_request` - enter_request
    Activity:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ActivityLine'
      required:
      - results
    ActivityLine:
      type: object
      properties:
        occurred_at:
          type: string
          format: date-time
        lab:
          type: string
          format: uuid
        lab_code:
          type: string
        actor:
          type: string
        summary:
          type: string
        target:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ActivityTarget'
          - $ref: '#/components/schemas/NullEnum'
        target_id:
          type: string
          format: uuid
          nullable: true
      required:
      - actor
      - lab
      - lab_code
      - occurred_at
      - summary
      - target
      - target_id
    ActivityTarget:
      enum:
      - strain
      - request
      - deposit
      - storage_unit
      - mta_template
      - lab
      - requesters
      type: string
      description: |-
        * `strain` - strain
        * `request` - request
        * `deposit` - deposit
        * `storage_unit` - storage_unit
        * `mta_template` - mta_template
        * `lab` - lab
        * `requesters` - requesters
    ApproveInputRequest:
      type: object
      properties:
        reason:
          type: string
          default: ''
          description: 'Why, in a sentence. Stored for good: name no person.'
          maxLength: 2000
    ApprovedPermit:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/PermitKind'
        reference:
          type: string
      required:
      - kind
      - public_id
      - reference
    BarcodeInputRequest:
      type: object
      properties:
        barcode:
          type: string
          maxLength: 64
      required:
      - barcode
    BatchCheckOutput:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        batch:
          type: string
          format: uuid
          readOnly: true
        batch_number:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/CheckKind'
          readOnly: true
        stage:
          allOf:
          - $ref: '#/components/schemas/CheckStage'
          readOnly: true
        checked_on:
          type: string
          format: date
          readOnly: true
        performed_by:
          type: string
          readOnly: true
        method:
          allOf:
          - $ref: '#/components/schemas/CheckMethod'
          readOnly: true
        method_detail:
          type: string
          readOnly: true
        result:
          allOf:
          - $ref: '#/components/schemas/CheckResult'
          readOnly: true
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
        unit:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/CheckUnit'
          - $ref: '#/components/schemas/BlankEnum'
        vial:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        vial_label:
          type: string
          nullable: true
          readOnly: true
        note:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CheckStatus'
          readOnly: true
        supersedes:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - batch
      - batch_number
      - checked_on
      - created_at
      - kind
      - method
      - method_detail
      - note
      - performed_by
      - public_id
      - reason
      - result
      - stage
      - status
      - supersedes
      - unit
      - value
      - vial
      - vial_label
    BatchCounts:
      type: object
      properties:
        pending_check:
          type: integer
        released:
          type: integer
        on_hold:
          type: integer
        exhausted:
          type: integer
      required:
      - exhausted
      - on_hold
      - pending_check
      - released
    BatchDecisionInputRequest:
      type: object
      description: 'A release or a hold: why, in a sentence.'
      properties:
        reason:
          type: string
          minLength: 1
          description: 'Why, in a sentence. Stored for good: name no person.'
      required:
      - reason
    BatchOutput:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        strain:
          type: string
          format: uuid
          readOnly: true
        number:
          type: integer
          readOnly: true
        passage:
          type: string
          format: uuid
          readOnly: true
        passage_number:
          type: integer
          readOnly: true
        method:
          allOf:
          - $ref: '#/components/schemas/PreservationMethod'
          readOnly: true
        cryoprotectant:
          type: string
          readOnly: true
        preserved_on:
          type: string
          format: date
          readOnly: true
        purpose:
          allOf:
          - $ref: '#/components/schemas/PurposeEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BatchOutputStatusEnum'
          readOnly: true
        status_reason:
          type: string
          readOnly: true
        status_changed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        latest_checks:
          allOf:
          - $ref: '#/components/schemas/LatestChecks'
          readOnly: true
        vial_count_created:
          type: integer
          readOnly: true
        vials_available:
          type: integer
          readOnly: true
        vials_distributable:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - cryoprotectant
      - latest_checks
      - method
      - number
      - passage
      - passage_number
      - preserved_on
      - public_id
      - purpose
      - status
      - status_changed_at
      - status_reason
      - strain
      - vial_count_created
      - vials_available
      - vials_distributable
    BatchOutputStatusEnum:
      enum:
      - pending_check
      - released
      - on_hold
      - exhausted
      type: string
      description: |-
        * `pending_check` - Pending check
        * `released` - Released
        * `on_hold` - On hold
        * `exhausted` - Exhausted
    BlankEnum:
      enum:
      - ''
    BoxGridOutput:
      type: object
      description: |-
        A box with every taken position (context `positions`, selectors.box_positions). A
        position missing from the list is empty.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        rows:
          type: integer
          readOnly: true
        cols:
          type: integer
          readOnly: true
        positions:
          type: array
          items:
            $ref: '#/components/schemas/BoxPosition'
          readOnly: true
      required:
      - cols
      - name
      - positions
      - public_id
      - rows
    BoxOutput:
      type: object
      description: 'A box in the list: its size, without its positions.'
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        rows:
          type: integer
          readOnly: true
        cols:
          type: integer
          readOnly: true
      required:
      - cols
      - name
      - public_id
      - rows
    BoxPosition:
      type: object
      description: 'One taken position (selectors.box_positions): the vial, or `masked`
        without it.'
      properties:
        row:
          type: integer
        col:
          type: integer
        label:
          type: string
          readOnly: true
        masked:
          type: boolean
          readOnly: true
        vial:
          allOf:
          - $ref: '#/components/schemas/BoxVial'
          nullable: true
          readOnly: true
      required:
      - col
      - label
      - masked
      - row
      - vial
    BoxTypeOutput:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        rows:
          type: integer
          readOnly: true
        cols:
          type: integer
          readOnly: true
      required:
      - cols
      - name
      - public_id
      - rows
    BoxVial:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        label:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/VialStatus'
        barcode:
          type: string
          nullable: true
        strain:
          type: string
          format: uuid
        accession_number:
          type: string
      required:
      - accession_number
      - barcode
      - label
      - public_id
      - status
      - strain
    CheckErrorInputRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          description: 'Why, in a sentence. Stored for good: name no person.'
          maxLength: 2000
      required:
      - reason
    CheckInputRequest:
      type: object
      properties:
        batch:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/CheckKind'
        stage:
          $ref: '#/components/schemas/CheckStage'
        checked_on:
          type: string
          format: date
        method:
          $ref: '#/components/schemas/CheckMethod'
        method_detail:
          type: string
          default: ''
          maxLength: 200
        result:
          $ref: '#/components/schemas/CheckResult'
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,4})?$
          nullable: true
        unit:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/CheckUnit'
          - $ref: '#/components/schemas/NullEnum'
        vial:
          type: string
          format: uuid
          nullable: true
        note:
          type: string
          default: ''
          description: What was seen, in a sentence. Required for a reduced result.
            Name no person.
          maxLength: 2000
        supersedes:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          default: ''
          description: 'Why, in a sentence. Stored for good: name no person.'
          maxLength: 2000
      required:
      - batch
      - checked_on
      - kind
      - method
      - result
      - stage
    CheckKind:
      enum:
      - identity
      - purity
      - viability
      type: string
      description: |-
        * `identity` - Identity
        * `purity` - Purity
        * `viability` - Viability
    CheckMethod:
      enum:
      - morphology
      - biochemical
      - maldi_tof
      - sequencing
      - streak_plate
      - microscopy
      - growth
      - plate_count
      - live_dead_stain
      - other
      type: string
      description: |-
        * `morphology` - Colony and cell morphology
        * `biochemical` - Biochemical profile
        * `maldi_tof` - MALDI-TOF mass spectrometry
        * `sequencing` - Gene sequencing
        * `streak_plate` - Streak plate
        * `microscopy` - Microscopy
        * `growth` - Growth after revival
        * `plate_count` - Plate count
        * `live_dead_stain` - Live and dead staining
        * `other` - Other
    CheckResult:
      enum:
      - pass
      - reduced
      - fail
      type: string
      description: |-
        * `pass` - Passed
        * `reduced` - Reduced
        * `fail` - Failed
    CheckStage:
      enum:
      - after_preservation
      - periodic
      - before_dispatch
      type: string
      description: |-
        * `after_preservation` - After preservation
        * `periodic` - Periodic
        * `before_dispatch` - Before dispatch
    CheckStatus:
      enum:
      - valid
      - entered_in_error
      type: string
      description: |-
        * `valid` - Valid
        * `entered_in_error` - Entered in error
    CheckUnit:
      enum:
      - cfu_per_ml
      - percent
      type: string
      description: |-
        * `cfu_per_ml` - CFU/mL
        * `percent` - %
    ChildOutput:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/UnitKind'
          readOnly: true
        name:
          type: string
          readOnly: true
        slot:
          type: integer
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/UnitStatus'
          readOnly: true
        rows:
          type: integer
          readOnly: true
          nullable: true
        cols:
          type: integer
          readOnly: true
          nullable: true
      required:
      - cols
      - kind
      - name
      - public_id
      - rows
      - slot
      - status
    ClassificationBasis:
      enum:
      - exempt_non_pathogenic
      - exempt_inactivated
      - indicative_list
      - professional_judgement
      type: string
      description: |-
        * `exempt_non_pathogenic` - Exempt: not pathogenic to humans or animals
        * `exempt_inactivated` - Exempt: neutralised or inactivated
        * `indicative_list` - Not on the indicative list of Category A
        * `professional_judgement` - Professional judgement
    Condition:
      enum:
