          readOnly: true
          nullable: true
        rejection_reason:
          type: string
          readOnly: true
        terms:
          allOf:
          - $ref: '#/components/schemas/TermsOutput'
          readOnly: true
        terms_history:
          type: array
          items:
            $ref: '#/components/schemas/TermsOutput'
          readOnly: true
      required:
      - condition
      - condition_note
      - created_at
      - decided_at
      - depositor
      - depositor_passages
      - name_as_received
      - public_id
      - received_on
      - rejection_reason
      - status
      - strain
      - terms
      - terms_history
