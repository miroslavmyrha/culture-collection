          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
    post:
      operationId: labs_strains_create
      parameters:
      - in: path
        name: lab_public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrainCreateInputRequest'
          multipart/form-data:
