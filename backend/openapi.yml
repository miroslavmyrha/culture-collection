      enum:
      - domain
      - kingdom
      - phylum
      - class
      - order
      - family
      - genus
      - species
      - subspecies
      - variety
      - form
      type: string
      description: |-
        * `domain` - Domain
        * `kingdom` - Kingdom
        * `phylum` - Phylum
        * `class` - Class
        * `order` - Order
        * `family` - Family
        * `genus` - Genus
        * `species` - Species
        * `subspecies` - Subspecies
        * `variety` - Variety
        * `form` - Form
    ReclassifyInputRequest:
      type: object
      properties:
        taxon:
          type: string
          format: uuid
        identified_on:
          type: string
          format: date
        method:
          type: string
          minLength: 1
          maxLength: 200
        reason:
          type: string
          minLength: 1
          description: 'Why, in a sentence. Stored for good: name no person.'
      required:
      - identified_on
      - method
      - reason
      - taxon
    RestrictionAddInputRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/RestrictionKind'
        reference:
          type: string
          minLength: 1
          maxLength: 100
        act:
          type: string
          default: ''
          maxLength: 30
        gmo_category:
          type: integer
          maximum: 4
          minimum: 1
          nullable: true
        reason:
          type: string
          minLength: 1
          description: 'Why, in a sentence. Stored for good: name no person.'
      required:
      - kind
      - reason
      - reference
    RestrictionBrief:
      type: object
      properties:
        kind:
          allOf:
          - $ref: '#/components/schemas/RestrictionKind'
          readOnly: true
        reference:
          type: string
          readOnly: true
      required:
      - kind
      - reference
    RestrictionEndInputRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          description: 'Why, in a sentence. Stored for good: name no person.'
      required:
      - reason
    RestrictionInputRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/RestrictionKind'
        reference:
          type: string
          minLength: 1
          maxLength: 100
        act:
          type: string
          default: ''
          maxLength: 30
        gmo_category:
          type: integer
          maximum: 4
          minimum: 1
          nullable: true
      required:
      - kind
      - reference
    RestrictionKind:
      enum:
      - cz_vrat
      - cz_rat
      - dual_use
      - quarantine_pest
      - gmo
      type: string
      description: |-
        * `cz_vrat` - Highly risky agent (VRAT), decree 474/2002 Sb., Annex 1
        * `cz_rat` - Risky agent (RAT), decree 474/2002 Sb., Annex 2
        * `dual_use` - Dual-use item, Regulation (EU) 2021/821, Annex I
        * `quarantine_pest` - Union quarantine pest, Regulation (EU) 2019/2072, Annex II
        * `gmo` - Genetically modified organism in contained use, act 78/2004 Sb.
    RestrictionOutput:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        kind:
