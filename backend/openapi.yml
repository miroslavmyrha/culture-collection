  /api/v1/labs/{lab_public_id}/strains/:
    get:
      operationId: labs_strains_list
      parameters:
      - in: path
        name: lab_public_id
        schema:
          type: string
          format: uuid
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: restriction
        schema:
          type: string
          enum:
          - cz_rat
          - cz_vrat
          - dual_use
          - gmo
          - quarantine_pest
        description: |-
          * `cz_vrat` - Highly risky agent (VRAT), decree 474/2002 Sb., Annex 1
          * `cz_rat` - Risky agent (RAT), decree 474/2002 Sb., Annex 2
          * `dual_use` - Dual-use item, Regulation (EU) 2021/821, Annex I
          * `quarantine_pest` - Union quarantine pest, Regulation (EU) 2019/2072, Annex II
          * `gmo` - Genetically modified organism in contained use, act 78/2004 Sb.
      - in: query
        name: risk_group
        schema:
          type: integer
          maximum: 32767
          minimum: 0
          enum:
          - 1
          - 2
          - 3
          - 4
        description: |-
          * `1` - 1
          * `2` - 2
          * `3` - 3
          * `4` - 4
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - deaccessioned
          - pending
          - restricted
        description: |-
          * `pending` - Pending
          * `active` - Active
          * `restricted` - Restricted
          * `deaccessioned` - Deaccessioned
      - in: query
        name: taxon
        schema:
          type: string
      tags:
      - labs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStrainListOutputList'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '403':
          content:
            application/problem+json:
