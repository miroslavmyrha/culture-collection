              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid input, an unknown taxon, or a risk group 4 agent (on
            risk_group)
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: 'The accession number is taken: try again'
        '422':
          content:
