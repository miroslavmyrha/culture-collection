[project]
name = "cultures-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django[argon2]",
    "djangorestframework",
    "drf-spectacular",
    "django-filter",
    "psycopg[binary]",
    "django-environ",
    "gunicorn",
    "whitenoise",
]

[dependency-groups]
dev = [
    "pytest",
    "django-migration-linter",
    "pip-audit",
    "pytest-django",
    "model-bakery",
    "time-machine",
    "ruff",
    "mypy",
    "django-stubs[compatible-mypy]",
    "djangorestframework-stubs[compatible-mypy]",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
exclude = ["**/migrations/*"]  # generated by makemigrations, never hand-formatted

[tool.ruff.lint]
# B023 (closures in loops) stays on: late-binding lambdas in on_commit are a real bug class.
select = ["E", "F", "W", "I", "B", "S", "DJ", "DTZ", "BLE", "UP", "SIM", "C4", "PL", "RUF", "T20"]
# RUF012: Django Meta (constraints, indexes) and action_perms are class-level by design.
ignore = ["PLR0913", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S106", "S108", "PLR2004"]
"**/core/testing/**" = ["S101"]  # shared test tools: assert is their job
"conftest.py" = ["S101"]
"**/migrations/**" = ["E501", "RUF012", "I001"]  # generated by makemigrations

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# Packages without type information. django-filter ships none, so FilterSet subclasses
# are typed as Any and need no ignore comment.
module = ["environ.*", "model_bakery.*", "sentry_sdk.*", "django_filters.*", "gunicorn.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
# --ds wins over a DJANGO_SETTINGS_MODULE in the environment, so
# `docker compose run backend pytest` uses the test settings, not compose's local ones.
# The root conftest.py refuses any other settings module.
addopts = "--ds=config.settings.test --strict-markers -q"
markers = [
    "slow: real transactions, threads or migrations (deselect with -m \"not slow\")",
    "migrations: migrates the schema back and forth (data migration tests)",
]
python_files = ["test_*.py"]
